version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Build and runtime images must stay on the same JDK, so update them together.
    groups:
      java-images:
        patterns: ['maven', 'eclipse-temurin']
    # The project targets Java 17; move JDK versions deliberately, not via PRs.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ['version-update:semver-major']
      - dependency-name: maven
        update-types: ['version-update:semver-major']
