name: Java CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: speedtest-exporter:ci
          cache-from: type=gha
      - name: Smoke test with a fake speedtest CLI
        run: |
          docker run -d --name exporter -p 9798:9798 \
            -v "$PWD/.github/ci/fake-speedtest.sh:/fake-speedtest.sh:ro" \
            -e SPEEDTEST_BINARY=/fake-speedtest.sh speedtest-exporter:ci
          for _ in $(seq 20); do
            curl -fsS http://localhost:9798/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:9798/metrics | tee metrics.txt
          for metric in speedtest_server_id speedtest_jitter_latency_milliseconds \
              speedtest_ping_latency_milliseconds speedtest_download_bits_per_second \
              speedtest_upload_bits_per_second speedtest_up; do
            grep -q "^$metric " metrics.txt || { echo "missing $metric"; docker logs exporter; exit 1; }
          done
          grep -q '^speedtest_up 1.0$' metrics.txt
          grep -q '^speedtest_download_bits_per_second 1.0E8$' metrics.txt
